# gts8uwifi-bt-addr: where hci0's public address comes from.
#
# BT_ADDR: leave empty to use the factory address. Set it, as
# AA:BB:CC:DD:EE:FF, to use another address instead; Android shows the
# factory one under Settings > About tablet > Status information.
BT_ADDR=

# BT_ADDR_FROM_EFS: with "yes" the factory address is read once from the
# tablet's efs partition, which is switched read-only at the block layer
# and mounted without journal replay, and then kept in
# /var/lib/gts8uwifi/bt_addr; efs is not mounted again. With "no" efs is
# never touched and a stable address derived from /etc/machine-id is used
# until BT_ADDR is set.
BT_ADDR_FROM_EFS=yes
