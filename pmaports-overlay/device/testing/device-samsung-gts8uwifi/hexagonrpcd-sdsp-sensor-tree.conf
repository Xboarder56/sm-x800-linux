# Only serve the sensor hub once there is a tree to serve.
#
# The tree under /usr/share/qcom/sm8450/Samsung/gts8uwifi/sensors is built
# on the tablet from the stock sensor configs (gts8uwifi-fw-extract); it
# cannot be in a package. On the X900, Alpine's hexagonrpcd 0.4.0 attached
# to the SLPI with no tree made the sensor process fault and the hub
# restart every 4 s, where no daemon at all leaves the hub running. So on
# a fresh root filesystem the daemon stays down until the tree exists.
# sns_reg.conf is the last file of a finished tree.
[Unit]
ConditionPathExists=/usr/share/qcom/sm8450/Samsung/gts8uwifi/sensors/sns_reg.conf
ConditionDirectoryNotEmpty=/usr/share/qcom/sm8450/Samsung/gts8uwifi/sensors/config
